[workspace]
resolver = "2"
members = [
  "crates/*",
  "plugins/*",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.7.1"
edition = "2021"
authors = ["tierlabx"]
license = "MIT"
repository = "https://github.com/tierlabx/widget-rs.git"

[workspace.dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
sticky_plugin = { path = "plugins/sticky", version = "0.7.1" }
todo_plugin = { path = "plugins/todo", version = "0.7.1" }
stretchly_plugin = { path = "plugins/stretchly", version = "0.7.1" }
fences_plugin = { path = "plugins/fences", version = "0.7.1" }
widget-core = { path = "crates/core", version = "0.7.1" }
widget-ui = { path = "crates/ui", version = "0.7.1" }

directories = "5.0"
image = { version = "0.24", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.28"
tray-icon = "0.14"
windows-sys = {
  version = "0.52",
  features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
  ]
}
winres = "0.1"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
# 优化级别：偏向体积和启动内存
opt-level = "s"
# 去除调试符号，减小体积
strip = true
# 启用链接时优化，大幅减小可执行文件体积
lto = true
# 出现 panic 直接中止，不展开栈
panic = "abort"
# 单个代码生成单元，优化更彻底（编译更慢）
codegen-units = 1


