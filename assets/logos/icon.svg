<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Emerald Glow for the active elements -->
    <filter id="emerald-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00d992" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00d992" flood-opacity="0.4"/>
    </filter>
    <!-- Soft shadow for floating widgets -->
    <filter id="ambient-haze" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Back Widget (Top Left) -->
  <rect x="30" y="30" width="100" height="100" rx="12" fill="#101010" stroke="#3d3a39" stroke-width="2" filter="url(#ambient-haze)" />
  <!-- Skeleton lines for back widget -->
  <rect x="50" y="55" width="40" height="6" rx="3" fill="#3d3a39" />
  <rect x="50" y="75" width="60" height="6" rx="3" fill="#3d3a39" />
  
  <!-- Back Widget (Top Right) -->
  <rect x="150" y="45" width="76" height="76" rx="12" fill="#101010" stroke="#3d3a39" stroke-width="2" filter="url(#ambient-haze)" />
  <rect x="165" y="65" width="46" height="6" rx="3" fill="#3d3a39" />

  <!-- Main Front Widget (Terminal) -->
  <rect x="48" y="90" width="160" height="130" rx="12" fill="#101010" stroke="#3d3a39" stroke-width="2" filter="url(#ambient-haze)" />
  
  <!-- Terminal Header Dots -->
  <circle cx="68" cy="110" r="4" fill="#3d3a39" />
  <circle cx="84" cy="110" r="4" fill="#3d3a39" />
  <circle cx="100" cy="110" r="4" fill="#3d3a39" />
  
  <!-- Glowing W (Terminal Output / Signal) -->
  <path d="M 80 140 L 105 190 L 128 150 L 151 190 L 176 140" fill="none" stroke="#00d992" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#emerald-glow)" />
</svg>
