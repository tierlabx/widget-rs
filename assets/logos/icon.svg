<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Widget Gradients -->
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d992" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Drop Shadow for Widgets -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Background (Mac squircle style) -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg-grad)" stroke="#3f3f3f" stroke-width="2" />
  
  <g filter="url(#shadow)">
    <!-- Top left: Emerald Green -->
    <rect x="56" y="56" width="64" height="64" rx="16" fill="url(#grad-green)" />
    <!-- Bottom left: Sky Blue -->
    <rect x="56" y="136" width="64" height="64" rx="16" fill="url(#grad-blue)" />
    <!-- Bottom right: Purple -->
    <rect x="136" y="136" width="64" height="64" rx="16" fill="url(#grad-purple)" />
    <!-- Top right: Amber Circle -->
    <rect x="136" y="56" width="64" height="64" rx="32" fill="url(#grad-amber)" />
  </g>
</svg>
