  <text class="layer-text" x="100" y="110">App Layer</text>
  <rect class="node-highlight" x="120" y="130" width="160" height="40" />
  <text class="node-text" x="200" y="155" text-anchor="middle">Main (main.rs)</text>
  <rect class="node" x="340" y="130" width="140" height="40" />
  <text class="node-text" x="410" y="155" text-anchor="middle">TrayIcon</text>
  <rect class="node" x="520" y="130" width="140" height="40" />
  <text class="node-text" x="590" y="155" text-anchor="middle">WindowManager</text>
  <rect class="node" x="700" y="130" width="140" height="40" />
  <text class="node-text" x="770" y="155" text-anchor="middle">PluginManager</text>
  <rect class="layer-box" x="80" y="240" width="800" height="120" />
  <text class="layer-text" x="100" y="270">Plugin System</text>
  <rect class="node" x="700" y="290" width="140" height="40" rx="20" />
  <text class="node-text" x="770" y="315" text-anchor="middle">Plugin Trait</text>
  <rect class="node" x="180" y="290" width="140" height="40" />
  <text class="node-text" x="250" y="315" text-anchor="middle">StickyPlugin</text>
  <rect class="node" x="380" y="290" width="140" height="40" />
  <text class="node-text" x="450" y="315" text-anchor="middle">TodoPlugin</text>
  <rect class="layer-box" x="80" y="400" width="800" height="120" />
  <text class="layer-text" x="100" y="430">Core &amp; UI</text>
  <rect class="node" x="240" y="450" width="180" height="40" />
  <text class="node-text" x="330" y="475" text-anchor="middle">widget-ui + GPUI</text>
  <rect class="node" x="540" y="450" width="180" height="40" />
  <text class="node-text" x="630" y="475" text-anchor="middle">widget-core</text>
  <rect class="layer-box" x="80" y="560" width="800" height="100" />
  <text class="layer-text" x="100" y="590">System Native</text>
  <rect class="node-highlight" x="520" y="600" width="180" height="40" rx="20"/>
  <text class="node-text" x="610" y="625" text-anchor="middle" fill="#00d992">Edge Snapping (Win32)</text>
  <path class="arrow-dashed" d="M 280,150 L 332,150" />
  <path class="arrow-dashed" d="M 200,170 L 200,200 L 590,200 L 590,178" />
  <path class="arrow-dashed" d="M 200,170 L 200,220 L 770,220 L 770,178" />
  <path class="arrow" d="M 770,170 L 770,282" />
  <rect class="label-bg" x="780" y="215" width="60" height="20" />
  <text class="label-text" x="810" y="229" text-anchor="middle">manages</text>
  <path class="arrow-dashed" d="M 700,310 L 328,310" />
  <path class="arrow-dashed" d="M 700,310 L 528,310" />
  <path class="arrow" d="M 250,330 L 250,442" />
  <path class="arrow" d="M 450,330 L 450,400 L 330,400 L 330,442" />
  <rect class="label-bg" x="190" y="375" width="50" height="20" />
