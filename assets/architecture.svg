  <path class="arrow" d="M 630,450 L 630,360 L 820,360 L 820,170 L 810,170" />
  <rect class="label-bg" x="825" y="255" width="80" height="20" />
  <text class="label-text" x="865" y="269" text-anchor="middle">config state</text>
  <path class="arrow-dashed" d="M 540,470 L 428,470" />
  <path class="arrow" d="M 590,170 L 590,592" />
  <rect class="label-bg" x="595" y="525" width="160" height="20" />
  <text class="label-text" x="675" y="539" text-anchor="middle">WM_WINDOWPOSCHANGING</text>
</svg>