<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap");
    text { font-family: "Inter", sans-serif; }
    .node { fill: #1c1c1e; stroke: #3d3a39; stroke-width: 2; rx: 8; }
    .node-text { fill: #e5e5ea; font-size: 14px; font-weight: 500; }
    .node-highlight { fill: #0a0a0c; stroke: #00d992; stroke-width: 2; rx: 8; }
    .layer-box { fill: none; stroke: #2c2c2e; stroke-width: 2; stroke-dasharray: 6 4; rx: 12; }
    .layer-text { fill: #8e8e93; font-size: 16px; font-weight: 600; }
    .arrow { stroke: #00d992; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-dashed { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowhead-gray); }
    .label-bg { fill: #000000; opacity: 0.8; rx: 4; }
    .label-text { fill: #a1a1aa; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d992" />
    </marker>
    <marker id="arrowhead-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#050507"/>
  <text x="480" y="40" fill="#e5e5ea" font-size="20" font-weight="600" text-anchor="middle">Widget-RS Architecture</text>
