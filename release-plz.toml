[workspace]

# Disable all release actions (tagging, publishing, changelogs) for internal crates
[[package]]
name = "widget-core"
release = false

[[package]]
name = "widget-ui"
release = false

[[package]]
name = "sticky_plugin"
release = false

[[package]]
name = "todo_plugin"
release = false

# Configure the main app crate to hold the unified changelog
[[package]]
name = "widget-rs"
# Place the changelog in the root of the workspace
changelog_path = "../../CHANGELOG.md"
# Disable publishing to crates.io (we only want GitHub releases)
publish = false
# Include commits from all internal crates in this unified changelog
changelog_include = ["widget-core", "widget-ui", "sticky_plugin", "todo_plugin"]
