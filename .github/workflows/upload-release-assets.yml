name: Upload Release Assets

on:
  push:
    tags:
      - 'v*' # Trigger when release-plz creates a new version tag

jobs:
  build-and-upload:
    name: Build and Upload
    runs-on: windows-latest
    permissions:
      contents: write # Need this to upload to the release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p widget-rs

      - name: Package and rename binary
        shell: pwsh
        run: |
          # Get the tag name (e.g., v0.1.1)
          $TAG_NAME = "${{ github.ref_name }}"
          # Create a directory to hold the files we want to zip
          $DIST_DIR = "widget-rs-$TAG_NAME-windows"
          New-Item -ItemType Directory -Path $DIST_DIR
          # Copy the executable to the folder
          Copy-Item target\release\widget-rs.exe $DIST_DIR\
          # Zip the folder
          Compress-Archive -Path $DIST_DIR -DestinationPath "$DIST_DIR.zip"
          
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: widget-rs-${{ github.ref_name }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
