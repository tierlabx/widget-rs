[package]
name = "todo_plugin"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
raw-window-handle.workspace = true
widget-core.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
